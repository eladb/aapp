/* ==========================================================================
   Beautiful UI re-skin (beautifului.dev) — neutral surfaces, electric-blue
   accent, hairline borders drawn as box-shadow, JetBrains-mono numbers, a
   pixel-grid thinking loader, chip tool-calls and a radio approval card.
   The standard Beautiful UI theme, no decorative extras. Dark-first,
   follows the system color scheme.
   Tokens copied verbatim from Beautiful UI's compiled CSS. Fonts (Inter +
   JetBrains Mono) are inlined by build.mjs from src/fonts.css.
   ========================================================================== */

/* ---------- design tokens: :root = light, dark via prefers-color-scheme ---- */
:root{
  --page:#fafafb; --canvas:#f1f2f3; --surface:#ffffff; --inset:#f7f8f9;
  --hover:#f4f5f6; --hover-2:#e7e9eb; --field:#f2f2f3; --line:#ecedef; --line-strong:#e0e2e5;
  --ink:#1f2124; --ink-2:#62656b; --ink-3:#9a9da3;
  --accent:#0285ff; --accent-ink:#0170dd; --accent-tint:#e9f3ff;
  --green:#189a4d; --orange:#ef720c; --red:#e3474c;
  --green-tint:#e8f5ed; --red-tint:#fcecec;
  --code-bg:#f7f8f9; --code-fg:#1f2124;
  --shadow-hairline:0 0 0 1px var(--line);
  --shadow-btn:0 0 0 1px var(--line-strong),0 1px 2px #1018280d;
  --shadow-card:0 0 0 1px var(--line),0 1px 2px #1018280a,0 2px 6px #10182808;
  --shadow-raised:0 0 0 1px var(--line),0 2px 10px #0000000b;
  --shadow-overlay:0 0 0 1px var(--line),0 8px 28px #0001;
  --shadow-inset-field:inset 0 1px 2px #0000001f;
  --ease:cubic-bezier(.23,1,.32,1);
  --font-ui:"Inter","Inter Fallback",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"JetBrains Mono","JetBrains Mono Fallback",ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px; --r-card:10px; --r-window:14px;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#17181a; --canvas:#1c1d1f; --surface:#232427; --inset:#1f2022;
    --hover:#2a2b2e; --hover-2:#313236; --field:#2b2c2f; --line:#2e3033; --line-strong:#3a3c40;
    --ink:#f2f3f4; --ink-2:#a5a8ad; --ink-3:#6c6f75;
    --accent:#3d9aff; --accent-ink:#7ec0ff; --accent-tint:#3d9aff29;
    --green:#3dbb72; --orange:#f68f3c; --red:#ee5c61;
    --green-tint:#3dbb7224; --red-tint:#ee5c6124;
    --code-bg:#1a1b1d; --code-fg:#e6e8ea;
    --shadow-btn:0 0 0 1px var(--line-strong),0 1px 2px #0000004d;
    --shadow-card:0 0 0 1px var(--line),0 1px 2px #0003,0 2px 6px #0003;
    --shadow-raised:0 0 0 1px var(--line),0 2px 10px #00000038;
    --shadow-overlay:0 0 0 1px var(--line-strong),0 8px 28px #00000057;
    --shadow-inset-field:inset 0 1px 2px #0006;
  }
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; -webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background-color:var(--page);
  font:14px/1.5 var(--font-ui);
  font-feature-settings:"cv11","ss01"; letter-spacing:-0.01em;
  overflow:hidden; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  height:100%; height:-webkit-fill-available; height:100svh; height:100dvh;
}
#root{
  display:flex; flex-direction:column; overflow:hidden;
  height:100%; height:-webkit-fill-available; height:100svh; height:100dvh;
}

/* ---------- header ---------- */
header{
  padding:calc(var(--safe-t) + 11px) 14px 11px; gap:11px;
  display:flex; align-items:center; position:relative; z-index:5;
  background:color-mix(in srgb, var(--page) 82%, transparent);
  -webkit-backdrop-filter:saturate(1.3) blur(12px); backdrop-filter:saturate(1.3) blur(12px);
  box-shadow:0 1px 0 var(--line);
}
.avatar{
  width:34px; height:34px; border-radius:var(--r-lg); flex:0 0 auto;
  background:var(--surface); box-shadow:var(--shadow-hairline);
  display:grid; place-items:center; color:var(--ink); font-size:17px; overflow:hidden;
}
.htitle{flex:1; min-width:0}
.htitle b{display:block; font-size:14.5px; font-weight:600; letter-spacing:-0.015em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); margin-top:1px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); transition:.3s; flex:0 0 auto}
.dot.live{background:var(--green)} .dot.warn{background:var(--orange)} .dot.err{background:var(--red)}
.iconbtn{
  width:34px; height:34px; border:none; border-radius:var(--r-lg); background:transparent;
  color:var(--ink-2); font-size:19px; display:grid; place-items:center; cursor:pointer; transition:.15s;
}
.iconbtn:hover{background:var(--hover); color:var(--ink)}
.iconbtn:active{background:var(--field); transform:scale(.96)}

/* ---------- message list ---------- */
#scroll{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:14px 13px 12px; scroll-behavior:smooth}
#list{display:flex; flex-direction:column; gap:5px; max-width:760px; margin:0 auto}
.row{display:flex; align-items:flex-end}
.row.me{flex-direction:row-reverse}
.row.them + .row.me, .row.me + .row.them{margin-top:11px}

/* assistant = crisp text, no bubble fill; user = right pill on --field */
.bubble{
  max-width:100%; min-width:0; padding:0; position:relative;
  color:var(--ink); overflow-wrap:anywhere; line-height:1.55; font-size:14px;
  animation:pop-in .2s var(--ease) both;
}
.row.them{align-items:flex-start}
.row.them .bubble{max-width:100%; padding-right:6px; animation:fade-blur .4s var(--ease) both}
/* Beautiful UI 07: user turn = right-aligned pill on --field, rounded-xl,
   px-3 py-1.5, flat (no border/shadow) */
.row.me .bubble{
  max-width:82%; padding:7px 12px; border-radius:var(--r-xl);
  background:var(--field); color:var(--ink); box-shadow:none;
}
.bubble .meta{font-family:var(--font-mono); font-size:10px; color:var(--ink-3); margin-top:3px; text-align:right; letter-spacing:0}
.row.them .bubble .meta{text-align:left}
.bubble p{margin:0 0 7px} .bubble p:last-child{margin-bottom:0}
.bubble a{color:var(--accent-ink); text-decoration:underline; text-underline-offset:2px; text-decoration-thickness:.06em}
.bubble a.filechip,.bubble a.attlink{text-decoration:none}
.bubble ul,.bubble ol{margin:6px 0; padding-left:20px}
.bubble li{margin:3px 0}
.bubble h1,.bubble h2,.bubble h3{margin:10px 0 5px; font-size:1.02em; font-weight:600; line-height:1.3; letter-spacing:-.02em}
.bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child{margin-top:0}
.bubble strong{font-weight:600}
.bubble code.inline{background:var(--inset); box-shadow:var(--shadow-hairline); padding:1px 5px; border-radius:var(--r-sm); font-size:.86em; font-family:var(--font-mono); color:var(--ink)}
.row.me .bubble code.inline{background:var(--surface)}

/* code block — Beautiful UI 17: filename + language header bar, dark inset body */
.codewrap{margin:8px 0; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden}
.codebar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 10px 7px 12px; border-bottom:1px solid var(--line)}
.codebar .cbl{display:flex; align-items:baseline; gap:8px; min-width:0}
.codebar .cbname{font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.codebar .cblang{font-size:11.5px; color:var(--ink-3); flex:0 0 auto}
.copy{flex:0 0 auto; display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 7px; font-size:11.5px; font-weight:500;
  border-radius:var(--r-md); border:none; background:transparent; color:var(--ink-3); cursor:pointer; transition:.1s}
.copy svg{width:10px; height:10px}
.copy:hover{background:var(--hover); color:var(--ink)} .copy:active{transform:scale(.96)}
.bubble pre{background:var(--code-bg); color:var(--code-fg); padding:12px 13px; border-radius:0; box-shadow:none; overflow-x:auto; margin:0; font-size:12px; line-height:1.6}
.bubble pre code{font-family:var(--font-mono)}

/* tables */
.tablewrap{overflow-x:auto; margin:8px 0; border-radius:var(--r-lg); box-shadow:var(--shadow-hairline); -webkit-overflow-scrolling:touch}
.bubble table,.act .ax table{border-collapse:collapse; width:100%; font-size:12.5px}
.bubble th,.bubble td,.act .ax th,.act .ax td{border-bottom:1px solid var(--line); padding:8px 12px; text-align:left; white-space:nowrap}
.bubble thead th,.act .ax thead th{background:var(--inset); font-weight:600; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3)}
.bubble tbody td{font-variant-numeric:tabular-nums}
.bubble tbody tr:last-child td,.act .ax tbody tr:last-child td{border-bottom:none}

.sys{align-self:center; max-width:88%; text-align:center; font-size:12px; line-height:1.5; color:var(--ink-2); padding:2px 8px; margin:10px 0 4px}
.daysep{align-self:center; font-family:var(--font-mono); font-size:10px; font-weight:500; color:var(--ink-3); letter-spacing:.08em; text-transform:uppercase; margin:14px 0 4px}
.row.me .bubble.failed{box-shadow:0 0 0 1px var(--red)}

/* ---------- attachments ---------- */
.filein{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; clip:rect(0,0,0,0); border:0; padding:0; margin:-1px}
.row.me .bubble.media{padding:4px} .bubble.media .meta{padding:1px 6px 3px}
.attlink{display:block; line-height:0}
.att{display:block; max-width:min(240px,72vw); max-height:340px; width:auto; height:auto; border-radius:var(--r-lg); object-fit:cover; background:var(--inset)}
.att.up{opacity:.5}
.filechip{display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit; padding:4px 4px}
.filechip .fi{font-size:18px; flex:0 0 auto; width:36px; height:36px; display:grid; place-items:center; background:var(--inset); box-shadow:var(--shadow-hairline); border-radius:var(--r-md)}
.filechip .fn{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px}
.filechip .fs{color:var(--ink-3); font-family:var(--font-mono); font-size:11px; flex:0 0 auto}

/* ---------- activity feed rows (inside the trace — Beautiful UI reasoning rows) ---------- */
.act{align-self:stretch; display:flex; gap:9px; align-items:flex-start; font-size:12.5px; color:var(--ink-2); padding:3px 0; margin:0; width:100%;
  animation:fade-blur .4s var(--ease) both}
.act .ai{flex:0 0 auto; width:12px; display:flex; justify-content:center; padding-top:3px; font-size:10px; color:var(--accent)}
.act .ax{flex:1; min-width:0; white-space:pre-wrap; overflow-wrap:anywhere}
.act.assistant .ax{color:var(--ink); white-space:normal; font-size:13px; line-height:1.5}
.act.user .ax{color:var(--ink-2)}
.act .ax p{margin:0 0 4px} .act .ax p:last-child{margin:0}
.act .ax ul,.act .ax ol{margin:2px 0; padding-left:18px}
.act .ax pre{background:var(--code-bg); color:var(--code-fg); box-shadow:var(--shadow-hairline); padding:9px 11px; border-radius:var(--r-md); overflow-x:auto; margin:4px 0; font-size:11px; font-family:var(--font-mono)}
.act .ax code.inline{background:var(--inset); box-shadow:var(--shadow-hairline); padding:1px 4px; border-radius:var(--r-sm); font-size:.85em; font-family:var(--font-mono)}
body.hide-activity .act{display:none}

/* ---------- tool-call chips (compact inset mono chips — Beautiful UI 05) ---------- */
.toolrow{display:flex; flex-wrap:wrap; align-items:center; gap:5px; padding:2px 0}
.toolchip{align-self:flex-start; display:inline-flex; align-items:center; gap:4px; max-width:100%;
  height:18px; padding:0 3px; border-radius:5px; background:var(--inset); box-shadow:var(--shadow-hairline);
  font-family:var(--font-mono); font-size:10.5px; color:var(--ink-2); overflow:hidden;
  transition:background-color .15s, color .15s; animation:pop-in .25s var(--ease) both}
.toolchip:hover{background:var(--hover); color:var(--ink)}
.toolchip .tg{flex:0 0 auto; width:11px; height:11px; display:grid; place-items:center; color:var(--ink-3)}
.toolchip .tg svg{width:11px; height:11px; display:block}
.toolchip .tt{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
body.hide-activity .toolchip,body.hide-activity .toolrow{display:none}

/* ---------- task rows (Beautiful UI 06) — capsule rows with a status token ---------- */
.tasklist{align-self:stretch; max-width:760px; width:100%; margin:4px auto; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; animation:fade-up .34s var(--ease) both}
.taskrow{display:flex; align-items:center; gap:10px; height:44px; padding:0 10px; transition:background-color .1s}
.taskrow + .taskrow{border-top:1px solid var(--line)}
.taskrow:hover{background:var(--inset)}
.tasktok{flex:0 0 auto; width:24px; height:24px; position:relative; display:grid; place-items:center}
.tasktok .chk{width:22px; height:22px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; animation:pop-in .3s var(--ease) both}
.tasktok .chk svg{width:13px; height:13px}
.tasktok .ring{position:absolute; inset:0; animation:spin 1.1s linear infinite}
.tasktok .num{position:relative; font-family:var(--font-mono); font-size:10.5px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.taskrow .tlabel{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:500; color:var(--ink)}
.taskrow .tmeta{flex:0 0 auto; font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.taskchip{flex:0 0 auto; display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:999px; font-size:11.5px; font-weight:500}
.taskchip.done{background:var(--green-tint); color:var(--green)}
.taskchip.run{background:var(--accent-tint); color:var(--accent-ink)}
body.hide-activity .tasklist{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- collapsible thinking / working trace ---------- */
.trace{align-self:stretch; max-width:760px; width:100%; margin:4px auto; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow-hairline); overflow:hidden; animation:fade-up .3s var(--ease) both}
.trace-h{display:flex; align-items:center; gap:9px; padding:9px 12px; cursor:pointer; user-select:none; font-size:12.5px; color:var(--ink-2)}
.trace-h .spark{color:var(--accent); font-size:13px; flex:0 0 auto; line-height:1}
.trace-h .tlbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; color:var(--ink)}
.trace-h .tn{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3)}
.trace-h .chev{flex:0 0 auto; transition:transform .2s var(--ease); font-size:11px; color:var(--ink-3)}
.trace.open .trace-h .chev{transform:rotate(180deg)}
.trace-b{display:none; padding:4px 12px 11px; border-top:1px solid var(--line)}
.trace.open .trace-b{display:block}
body.hide-activity .trace{display:none}

/* ---------- approval / ask card (Beautiful UI 04) ---------- */
.askwrap{align-self:stretch; max-width:760px; width:100%; margin:8px auto; animation:fade-up .35s var(--ease) both}
.askcard{max-width:340px; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; padding:12px}
.askhead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:8px}
.askhead .qq{font-size:13px; font-weight:600; line-height:1.4; color:var(--ink); letter-spacing:-.01em}
.askx{flex:0 0 auto; width:28px; height:28px; margin:-6px -6px 0 0; border:none; border-radius:var(--r-lg); background:transparent;
  color:var(--ink-3); font-size:18px; line-height:1; display:grid; place-items:center; cursor:pointer; transition:.1s}
.askx:hover{background:var(--hover); color:var(--ink-2)}
.askopts{display:flex; flex-direction:column; gap:1px}
.askopt{display:flex; align-items:center; gap:8px; margin:0 -6px; padding:4px 6px; border-radius:var(--r-lg); border:none; background:transparent; color:var(--ink);
  font:inherit; font-size:13px; text-align:left; cursor:pointer; transition:background .1s; width:calc(100% + 12px)}
.askopt:hover{background:var(--hover)}
.askopt .ring{flex:0 0 auto; width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 1.5px var(--line-strong);
  transition:background .2s, box-shadow .2s; display:grid; place-items:center}
.askopt .ring .dot{width:6px; height:6px; border-radius:50%; background:var(--canvas); transform:scale(0); transition:transform .2s var(--ease)}
.askopt.chosen .ring{background:var(--ink); box-shadow:none}
.askopt.chosen .ring .dot{transform:scale(1)}
.askopt .ol{flex:1; min-width:0; color:var(--ink-2); transition:color .2s}
.askopt.chosen .ol{color:var(--ink)}
.askopt.askcustom .ring{box-shadow:none; background:transparent}
.askopt.askcustom .ol{color:var(--ink-3)}
.askcard.answered .askopt{cursor:default; pointer-events:none}
.askcard.answered .askopt:not(.chosen){opacity:.45}
.askcard.answered .askcustom{display:none}

/* ---------- Wave B: task list extras (title + status token/chip variants) ---- */
.taskhead{padding:9px 12px 7px; font-size:12.5px; font-weight:600; color:var(--ink); border-bottom:1px solid var(--line)}
.tasktok .chk.xf{background:var(--red)}
.tasktok .todo{width:15px; height:15px; border-radius:50%; box-shadow:inset 0 0 0 1.6px var(--line-strong)}
.tasktok .ring{width:22px; height:22px}
.taskchip.todo{background:var(--inset); color:var(--ink-3)}
.taskchip.failed{background:var(--red-tint); color:var(--red)}

/* ---------- Wave B: recommendation card (Beautiful UI 09) ---------- */
.recowrap{align-self:stretch; max-width:760px; width:100%; margin:8px auto; animation:fade-up .35s var(--ease) both}
.recocard{max-width:380px; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden}
.recobody{padding:12px 13px; font-size:13px; line-height:1.55; color:var(--ink-2)}
.recobody p{margin:0 0 6px} .recobody p:last-child{margin:0}
.recobody strong{color:var(--ink); font-weight:600}
.recobody code.inline{background:var(--accent-tint); box-shadow:none; padding:1px 5px; border-radius:var(--r-sm); font-size:.86em; font-family:var(--font-mono); color:var(--accent-ink)}
.recofoot{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:9px 11px; border-top:1px solid var(--line); background:var(--inset)}
.confbox{display:flex; align-items:center; gap:8px; min-width:0}
.cmeter{display:inline-flex; align-items:flex-end; gap:2px; height:10px}
.cbar{width:4px; border-radius:999px; height:10px; transition:background .3s}
.conflbl{font-size:12.5px; font-weight:500; color:var(--ink-2); white-space:nowrap}
.recobtns{display:flex; align-items:center; gap:8px; margin-left:auto}
.recobtn{height:28px; padding:0 11px; border:none; border-radius:var(--r-md); font:inherit; font-size:12.5px; font-weight:500;
  background:var(--surface); color:var(--ink); box-shadow:var(--shadow-btn); cursor:pointer; transition:background-color .1s, transform .1s}
.recobtn:hover{background:var(--hover)} .recobtn:active{transform:scale(.96)}
.recobtn.primary{background:var(--accent); color:#fff; box-shadow:0 1px 2px #0000001f}
.recobtn.primary:hover{background:var(--accent-ink)}
.recobtn.chosen{background:var(--accent); color:#fff}
.recocard.answered .recobtn{pointer-events:none} .recocard.answered .recobtn:not(.chosen){opacity:.45}

/* ---------- Wave B: context / citation cards (Beautiful UI 10) ---------- */
.srcwrap{align-self:stretch; max-width:760px; width:100%; margin:8px auto; display:flex; flex-direction:column; gap:6px; animation:fade-up .35s var(--ease) both}
.srchead{display:flex; align-items:center; gap:8px; padding:0 2px}
.srctitle{font-size:13px; font-weight:600; color:var(--ink)}
.srccount{display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:var(--r-md); background:var(--inset); box-shadow:var(--shadow-hairline);
  font-family:var(--font-mono); font-size:11px; font-weight:500; color:var(--ink-2)}
.srccard{max-width:380px; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden}
.srcbar{display:flex; align-items:center; gap:10px; padding:8px 11px; border-bottom:1px solid var(--line)}
.srcname{display:flex; align-items:center; gap:6px; min-width:0; font-size:13px; font-weight:500; color:var(--ink)}
.srcname svg{flex:0 0 auto; color:var(--ink-3)}
.srctt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.srcmeta{margin-left:auto; flex:0 0 auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-3); white-space:nowrap}
.srcsnip{margin:0; padding:8px 11px 4px; font-size:12.5px; line-height:1.5; color:var(--ink-2)}
.srclinkwrap{padding:2px 11px 11px}
.srclink{display:inline-flex; align-items:center; gap:6px; max-width:100%; height:24px; padding:0 9px; border-radius:999px;
  background:var(--inset); box-shadow:var(--shadow-btn); color:var(--ink-2); text-decoration:none; font-size:12px; font-weight:500; transition:background-color .15s}
.srclink:hover{background:var(--hover)}
.srclink .srcurl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px}
.srclink svg{flex:0 0 auto; color:var(--ink-3)}

/* ---------- Wave B: records / data table (Beautiful UI 11/12/13) ---------- */
.tblwrap{align-self:stretch; max-width:760px; width:100%; margin:8px auto; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; animation:fade-up .35s var(--ease) both}
.tblhead{display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line)}
.tbltitle{font-size:13px; font-weight:600; color:var(--ink)}
.tblcount{display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:var(--r-md); background:var(--inset); box-shadow:var(--shadow-hairline);
  font-family:var(--font-mono); font-size:11px; font-weight:500; color:var(--ink-2)}
.tblscroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
.rtable{border-collapse:collapse; width:100%; font-size:12.5px}
.rhcell{position:sticky; top:0; background:var(--inset); padding:8px 12px; text-align:left; white-space:nowrap;
  font-weight:600; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); border-bottom:1px solid var(--line)}
.rrow:hover{background:var(--inset)}
.rcell{padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; color:var(--ink); vertical-align:middle}
.rrow:last-child .rcell{border-bottom:none}
.rnum{font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-2)}
.rnum.pos{color:var(--green)} .rnum.neg{color:var(--red)}
.rentity{display:flex; align-items:center; gap:8px}
.rmark{flex:0 0 auto; width:22px; height:22px; border-radius:var(--r-md); display:grid; place-items:center; color:#fff; font-size:11px; font-weight:600; font-family:var(--font-mono)}
.rname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500}
.rtags{display:inline-flex; align-items:center; gap:5px; flex-wrap:wrap}
.rtag{display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 8px; border-radius:999px; background:var(--inset); box-shadow:var(--shadow-hairline); font-size:11.5px; font-weight:500; color:var(--ink-2)}
.rtdot{width:6px; height:6px; border-radius:50%; flex:0 0 auto}
.rmuted{color:var(--ink-3)}
.tblfoot{padding:7px 12px; border-top:1px solid var(--line); background:var(--inset); font-family:var(--font-mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* ---------- Wave B: insight / stat card (Beautiful UI 16) ---------- */
.inswrap{align-self:stretch; max-width:760px; width:100%; margin:8px auto; animation:fade-up .35s var(--ease) both}
.inscard{max-width:360px; border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow-card); padding:13px}
.inshead{display:flex; align-items:baseline; gap:6px; margin-bottom:2px}
.institle{font-size:13px; font-weight:600; color:var(--ink)}
.inscount{font-family:var(--font-mono); font-size:12px; color:var(--ink-3)}
.insprose{margin:4px 0 0; font-size:12.5px; line-height:1.6; color:var(--ink-2)}
.insprose strong{color:var(--ink); font-weight:600}
.insd{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-2)}
.insd.pos{color:var(--green)} .insd.neg{color:var(--red)}
.insmention{display:inline-flex; align-items:center; gap:4px; font-weight:500; color:var(--ink)}
.insmdot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:0 0 auto}
.insstats{display:flex; gap:14px; margin-top:11px; padding:11px; border-radius:var(--r-md); background:var(--inset); box-shadow:var(--shadow-hairline)}
.insstat{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.insname{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.insdot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:0 0 auto}
.insdot.up{background:var(--green)} .insdot.down{background:var(--orange)}
.insval{font-size:17px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; color:var(--ink)}
.insval.pos{color:var(--green)} .insval.neg{color:var(--red)}
.insdelta{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-3)}
.insdelta.pos{color:var(--green)} .insdelta.neg{color:var(--red)}
.insfollow{margin-top:11px; border:none; border-radius:999px; background:var(--surface); box-shadow:var(--shadow-btn); color:var(--ink);
  padding:7px 13px; font:inherit; font-size:12px; text-align:left; cursor:pointer; transition:background-color .1s}
.insfollow:hover{background:var(--hover)}

/* ---------- diff blocks ---------- */
.dl{display:block; padding:0 13px; margin:0 -13px}
.dl.add{background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green)}
.dl.del{background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--red)}

/* ---------- thinking indicator (pixel-grid + mono elapsed) ---------- */
.think{display:inline-flex; align-items:center; gap:10px; padding:6px 0}
.pixgrid{display:grid; grid-template-columns:repeat(3,4px); gap:1.5px; flex:0 0 auto}
.pixgrid i{width:4px; height:4px; border-radius:1px; background:var(--ink); opacity:.15; animation:pixel-on .65s ease-in-out infinite}
.pixgrid i:nth-child(1){animation-delay:90ms} .pixgrid i:nth-child(2){animation-delay:180ms}
.pixgrid i:nth-child(3){animation-delay:270ms} .pixgrid i:nth-child(4){animation-delay:0ms}
.pixgrid i:nth-child(5){animation-delay:90ms} .pixgrid i:nth-child(6){animation-delay:180ms}
.pixgrid i:nth-child(7){animation-delay:90ms} .pixgrid i:nth-child(8){animation-delay:180ms}
.pixgrid i:nth-child(9){animation-delay:270ms}
.think .lbl{font-weight:500; font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2)}
.think .elapsed{font-family:var(--font-mono); font-size:12px; color:var(--ink-3); flex:0 0 auto; font-variant-numeric:tabular-nums}

/* streaming caret — Beautiful UI 03: w-[3px] h-3 rounded-full bg-accent */
.stream-caret{display:inline-block; width:3px; height:.86em; vertical-align:text-bottom; margin-left:3px; border-radius:999px; background:var(--accent); animation:caret-blink 1s step-end infinite}

/* ---------- empty state ---------- */
.empty{margin:16vh auto 0; text-align:center; color:var(--ink-2); max-width:320px; padding:0 20px}
.empty .big{width:54px; height:54px; border-radius:var(--r-xl); margin:0 auto 14px; background:var(--surface); box-shadow:var(--shadow-hairline); display:grid; place-items:center; font-size:24px; color:var(--ink)}
.empty h2{margin:0 0 6px; color:var(--ink); font-size:16px; font-weight:600}
.empty p{font-size:13px; line-height:1.6}

/* ---------- prompt bar (Beautiful UI 08) — single rounded --surface field,
   leading + attach, trailing filled-accent send that lights up on text ---- */
.composer{
  background:color-mix(in srgb, var(--page) 88%, transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px); backdrop-filter:saturate(1.4) blur(12px);
  box-shadow:0 -1px 0 var(--line);
  padding:10px 12px calc(10px + var(--safe-b)); position:relative; z-index:5;
}
.composerbar{
  display:grid; grid-template-columns:28px minmax(0,1fr) 28px; align-items:end; gap:4px;
  max-width:760px; margin:0 auto;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-window); padding:6px;
  box-shadow:0 1px 2px #10182808;
  transition:border-color .15s;
}
.composerbar:focus-within{border-color:var(--line-strong)}
.composer textarea{
  min-width:0; resize:none; border:none; background:transparent; color:var(--ink);
  padding:5px 4px; font:inherit; font-size:16px; max-height:38vh; min-height:28px; line-height:1.28; outline:none;
  overflow-wrap:anywhere;
}
.composer textarea::placeholder{color:var(--ink-3)}
.attachbtn,.sendbtn{
  flex:0 0 auto; width:28px; height:28px; border:none; border-radius:var(--r-lg); cursor:pointer;
  display:grid; place-items:center; transition:background-color .15s, color .2s, transform .2s; padding:0; align-self:end;
}
.attachbtn{background:transparent; color:var(--ink-3); justify-self:start}
.attachbtn:hover{background:var(--hover); color:var(--ink)}
.attachbtn:active{transform:scale(.94)}
/* disabled/empty send = neutral chip; enabled (has text) = electric-blue */
.sendbtn{background:var(--line-strong); color:var(--ink-2)}
.sendbtn.ready{background:var(--accent); color:#fff}
.sendbtn:active:not(:disabled){transform:scale(.94)}
.sendbtn:disabled{cursor:default}

/* ---------- scroll-to-latest FAB ---------- */
.fab{
  position:absolute; right:15px; bottom:calc(84px + var(--safe-b)); z-index:4;
  width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
  background:var(--surface); box-shadow:var(--shadow-raised); color:var(--ink);
  display:none; place-items:center; animation:pop-in .2s var(--ease) both;
}
.fab.show{display:grid}
.fab .fabarrow{font-size:17px; line-height:1}
.fab .badge{position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:var(--accent); color:#fff; font-family:var(--font-mono); font-size:10px; font-weight:600; display:grid; place-items:center}

/* ---------- settings sheet ---------- */
.scrim{position:fixed; inset:0; background:#00000066; z-index:20; opacity:0; pointer-events:none; transition:.2s}
.scrim.show{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--surface);
  box-shadow:var(--shadow-overlay); border-radius:16px 16px 0 0; padding:10px 18px calc(20px + var(--safe-b));
  transform:translateY(100%); transition:transform .25s var(--ease); max-width:560px; margin:0 auto;
}
.sheet.show{transform:none}
.grip{width:34px; height:4px; border-radius:2px; background:var(--line-strong); margin:4px auto 16px}
.sheet h3{margin:0 0 12px; font-size:15px; font-weight:600; color:var(--ink)}
.field{display:flex; gap:8px; align-items:center; background:var(--inset); box-shadow:var(--shadow-hairline); border-radius:var(--r-lg); padding:10px 12px; margin-bottom:10px; font-size:12px; color:var(--ink-2); word-break:break-all; font-family:var(--font-mono)}
.field .val{flex:1; min-width:0}
.row-btns{display:flex; gap:10px; flex-wrap:wrap}
.btn{flex:1; min-width:120px; border:none; background:var(--surface); box-shadow:var(--shadow-btn); color:var(--ink); padding:10px 12px; border-radius:var(--r-lg); font:inherit; font-weight:500; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent); color:#fff; box-shadow:0 1px 2px #0000001f}
.btn.primary:hover{background:var(--accent-ink)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:color-mix(in srgb, var(--red) 10%, transparent)}
.btn:active{transform:scale(.98)}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; background:var(--inset); box-shadow:var(--shadow-hairline); border-radius:var(--r-lg); margin-bottom:10px; font-weight:500; font-size:14px; cursor:pointer; color:var(--ink)}
.switch{width:42px; height:24px; border-radius:999px; background:var(--line-strong); position:relative; transition:.2s; flex:0 0 auto}
.switch.on{background:var(--accent)}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 2px #0003}
.switch.on::after{left:20px}
.hint{font-size:12px; color:var(--ink-3); margin:2px 0 14px; line-height:1.55}

/* ---------- segmented control (Beautiful UI 09) ---------- */
.seg{display:inline-flex; align-items:center; background:var(--field); border-radius:999px; padding:2px; flex:0 0 auto}
.seg button{border:none; background:transparent; color:var(--ink-3); font:inherit; font-weight:500; font-size:11.5px; line-height:1.4;
  padding:2px 10px; border-radius:999px; cursor:pointer; transition:background-color .15s, color .15s, box-shadow .15s}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-btn)}
.segrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; background:var(--inset);
  box-shadow:var(--shadow-hairline); border-radius:var(--r-lg); margin-bottom:10px; font-weight:500; font-size:14px; color:var(--ink)}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; bottom:calc(92px + var(--safe-b)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--page); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:.25s; z-index:30}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- selection actions (Beautiful UI 19) — floating pill toolbar that
   appears over a text selection inside a bubble; Explain · Improve · Shorten
   hand the passage to the agent, Copy keeps the plain copy affordance ------- */
.seltools{position:fixed; z-index:45; left:0; top:0; display:flex; align-items:center; gap:2px;
  height:36px; padding:4px; background:var(--surface); border-radius:999px; box-shadow:var(--shadow-overlay);
  opacity:0; transform:translateY(4px) scale(.96); transform-origin:center bottom;
  transition:opacity .16s var(--ease), transform .18s var(--ease); pointer-events:none;
  -webkit-font-smoothing:antialiased; font-family:var(--font-ui); white-space:nowrap}
.seltools.show{opacity:1; transform:none; pointer-events:auto}
.seltools button{display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 10px; flex:0 0 auto;
  border:none; background:transparent; color:var(--ink); font:inherit; font-size:12px; font-weight:400;
  letter-spacing:-.005em; border-radius:999px; cursor:pointer; transition:background-color .15s, transform .1s}
.seltools button svg{width:14px; height:14px; flex:0 0 auto; display:block}
.seltools button:hover{background:var(--hover)}
.seltools button:active{transform:scale(.96)}
.seltools button.ico{padding:0; width:28px; justify-content:center}
.seltools .sdiv{width:1px; height:16px; background:var(--line-strong); margin:0 3px; flex:0 0 auto}

/* ---------- keyframes (Beautiful UI) ---------- */
@keyframes pixel-on{0%,100%{opacity:.15} 18%,42%{opacity:1} 62%{opacity:.15}}
@keyframes caret-blink{0%,100%{opacity:1} 50%{opacity:0}}
@keyframes fade-up{0%{opacity:0} to{opacity:1}}
@keyframes pop-in{0%{opacity:0; transform:scale(.97)} to{opacity:1; transform:none}}
@keyframes fade-blur{0%{opacity:0} to{opacity:1}}

::selection{background:var(--accent-tint)}
#scroll::-webkit-scrollbar{width:7px} #scroll::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--ink-3) 45%, transparent); border-radius:4px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important}
  .stream-caret,.pixgrid i,.think .lbl{animation:none !important}
  .think .lbl{color:var(--ink-2)}
}

</style>
