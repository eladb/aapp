<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fffdfa" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent">
<meta name="format-detection" content="telephone=no">
<title>Agent</title>
<style>
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fffdfa}
@media (prefers-color-scheme:dark){body{background:#17110f}}
#root{height:100%}
/* ==========================================================================
   Ported verbatim from the vanilla app.html <style> — warm coral-branded
   palette, dark mode, diagonal-hatch background, and every component style —
   then extended at the very bottom with the React layout host (#root) and the
   liquid-gooey composer/FAB controls.
   ========================================================================== */
:root{
  --background:30 33% 99%; --foreground:20 14% 11%;
  --card:26 24% 93.5%; --card-foreground:20 14% 11%;
  --muted:26 20% 90%; --muted-foreground:22 10% 43%;
  --border:24 16% 88%; --input:24 16% 86%;
  --primary:11 98% 61%; --primary-foreground:0 0% 100%;
  --primary-strong:11 90% 52%;
  --accent:24 20% 94%; --accent-foreground:20 14% 11%;
  --destructive:2 80% 56%; --success:146 58% 40%; --warning:32 94% 48%;
  --ring:11 98% 61%; --radius:0.85rem;
  --code-bg:222 18% 13%; --code-fg:220 14% 90%;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --surface:0 0% 100%; --a-blue:210 100% 50%; --a-green:145 70% 35%;
  --a-orange:26 92% 49%; --a-red:358 72% 58%; --a-violet:265 100% 68%;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,monospace;
  --ease-strong:cubic-bezier(.23,1,.32,1);
  --stripe:220 10% 30%; --stripe-a:0.05;
}
@media (prefers-color-scheme:dark){
  :root{
    --surface:222 9% 16%; --a-blue:210 100% 62%; --a-green:145 55% 55%;
    --a-orange:28 90% 60%; --a-red:358 82% 65%; --a-violet:265 100% 74%;
    --stripe:0 0% 100%; --stripe-a:0.05;
  }
}
@media (prefers-color-scheme:dark){
  :root{
    --background:20 14% 7%; --foreground:30 14% 96%;
    --card:22 9% 15%; --card-foreground:30 14% 96%;
    --muted:22 9% 18%; --muted-foreground:24 8% 62%;
    --border:22 9% 21%; --input:22 9% 24%;
    --primary:11 100% 63%; --primary-foreground:0 0% 100%;
    --primary-strong:11 96% 56%;
    --accent:22 9% 18%; --accent-foreground:30 14% 96%;
    --destructive:2 74% 60%; --success:146 52% 50%; --warning:32 94% 56%;
    --ring:11 100% 63%;
    --code-bg:20 14% 4%; --code-fg:220 12% 88%;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0; color:hsl(var(--foreground));
  background-color:hsl(var(--background));
  background-image:repeating-linear-gradient(-45deg,
    transparent 0, transparent 7px,
    hsl(var(--stripe)/var(--stripe-a)) 7px, hsl(var(--stripe)/var(--stripe-a)) 8px);
  background-attachment:fixed;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  letter-spacing:-0.01em;
  overflow:hidden; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  height:100%; height:-webkit-fill-available; height:100svh; height:100dvh;
}
/* ---- header ---- */
header{
  padding:calc(var(--safe-t) + 10px) 14px 10px; gap:10px;
  display:flex; align-items:center; position:relative; z-index:5;
  background:hsl(var(--background)/0.8); backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid hsl(var(--border));
}
.avatar{
  width:36px; height:36px; border-radius:calc(var(--radius) - 2px); flex:0 0 auto;
  background:hsl(var(--muted)); border:1px solid hsl(var(--border));
  display:grid; place-items:center; color:hsl(var(--foreground)); font-size:19px; overflow:hidden;
}
.htitle{flex:1; min-width:0}
.htitle b{display:block; font-size:15px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.status{display:flex; align-items:center; gap:6px; font-size:12px; color:hsl(var(--muted-foreground))}
.dot{width:7px; height:7px; border-radius:50%; background:hsl(var(--muted-foreground)); transition:.3s}
.dot.live{background:hsl(var(--success))}
.dot.warn{background:hsl(var(--warning))} .dot.err{background:hsl(var(--destructive))}
.iconbtn{
  width:36px; height:36px; border:none; border-radius:calc(var(--radius) - 2px); background:transparent;
  color:hsl(var(--muted-foreground)); font-size:20px; display:grid; place-items:center; cursor:pointer; transition:.15s;
}
.iconbtn:hover{background:hsl(var(--accent)); color:hsl(var(--foreground))}
.iconbtn:active{background:hsl(var(--muted))}
/* ---- messages ---- */
#scroll{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:12px 12px 10px; scroll-behavior:smooth}
#list{display:flex; flex-direction:column; gap:4px; max-width:760px; margin:0 auto}
.row{display:flex; align-items:flex-end}
.row.me{flex-direction:row-reverse}
.row.them + .row.me, .row.me + .row.them{margin-top:9px}
.bubble{
  max-width:84%; min-width:0; padding:9px 13px; border-radius:20px; position:relative;
  background:hsl(var(--card)); color:hsl(var(--card-foreground));
  border-bottom-left-radius:7px; overflow-wrap:anywhere; line-height:1.45;
  box-shadow:0 1px 1px hsl(20 14% 8%/0.05); animation:pop .18s cubic-bezier(.2,.85,.3,1);
}
.row.me .bubble{
  background:hsl(var(--primary)); color:hsl(var(--primary-foreground));
  border-bottom-left-radius:20px; border-bottom-right-radius:7px;
  box-shadow:0 1px 3px hsl(var(--primary-strong)/0.3);
}
@keyframes pop{from{transform:translateY(5px) scale(.99); opacity:0} to{transform:none; opacity:1}}
.bubble .meta{font-size:10.5px; color:hsl(var(--muted-foreground)); margin-top:3px; text-align:right; opacity:.85}
.row.me .bubble .meta{color:hsl(var(--primary-foreground)/0.72)}
.bubble p{margin:0 0 6px} .bubble p:last-child{margin-bottom:0}
.bubble a{color:inherit; text-decoration:underline; text-underline-offset:2px; text-decoration-color:currentColor; text-decoration-thickness:.06em}
.bubble a.filechip,.bubble a.attlink{text-decoration:none}
.bubble ul,.bubble ol{margin:5px 0; padding-left:20px}
.bubble li{margin:2px 0}
.bubble h1,.bubble h2,.bubble h3{margin:8px 0 4px; font-size:1.03em; font-weight:700; line-height:1.25; letter-spacing:-.01em}
.bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child{margin-top:0}
.bubble code.inline{background:hsl(var(--muted)); padding:1.5px 5px; border-radius:6px; font-size:.84em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.row.me .bubble code.inline{background:hsl(var(--primary-foreground)/0.2)}
.codewrap{position:relative; margin:7px 0}
.bubble pre{background:hsl(var(--code-bg)); color:hsl(var(--code-fg)); padding:28px 13px 12px; border-radius:13px; overflow-x:auto; margin:0; font-size:12.5px; line-height:1.55}
.bubble pre code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.copy{position:absolute; top:6px; right:6px; font-size:10.5px; font-weight:500; padding:4px 10px; border-radius:8px; border:none; background:hsl(0 0% 100%/0.1); color:hsl(0 0% 90%); cursor:pointer; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.copy:active{background:hsl(0 0% 100%/0.2)}
.tablewrap{overflow-x:auto; margin:7px 0; border:1px solid hsl(var(--border)); border-radius:12px; -webkit-overflow-scrolling:touch}
.bubble table,.act .ax table{border-collapse:collapse; width:100%; font-size:12.5px}
.bubble th,.bubble td,.act .ax th,.act .ax td{border-bottom:1px solid hsl(var(--border)); padding:7px 12px; text-align:left; white-space:nowrap}
.bubble thead th,.act .ax thead th{background:hsl(var(--muted)); font-weight:600; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:hsl(var(--muted-foreground))}
.bubble tbody tr:last-child td,.act .ax tbody tr:last-child td{border-bottom:none}
.row.me .bubble .tablewrap{border-color:hsl(var(--primary-foreground)/0.25)}
.row.me .bubble th,.row.me .bubble td{border-bottom-color:hsl(var(--primary-foreground)/0.22)}
.row.me .bubble thead th{background:hsl(var(--primary-foreground)/0.12); color:hsl(var(--primary-foreground)/0.85)}
.sys{align-self:center; max-width:86%; text-align:center; font-size:12px; line-height:1.5;
  color:hsl(var(--muted-foreground)); padding:2px 8px; margin:8px 0 4px}
.daysep{align-self:center; font-size:10.5px; font-weight:600; color:hsl(var(--muted-foreground)); letter-spacing:.06em; text-transform:uppercase; margin:12px 0 4px}
.bubble.failed{box-shadow:0 0 0 1.5px hsl(var(--destructive))}
/* attachments */
.attbtn{width:44px; height:44px; flex:0 0 auto; border:none; border-radius:50%; background:hsl(var(--muted)/0.7); color:hsl(var(--muted-foreground)); font-size:25px; font-weight:300; line-height:1; display:grid; place-items:center; cursor:pointer; transition:.15s}
.attbtn:active{background:hsl(var(--muted)); color:hsl(var(--foreground)); transform:scale(.92)}
.filein{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; clip:rect(0,0,0,0); border:0; padding:0; margin:-1px}
.bubble.media{padding:4px} .bubble.media .meta{padding:1px 6px 3px}
.attlink{display:block; line-height:0}
.att{display:block; max-width:min(240px,72vw); max-height:340px; width:auto; height:auto; border-radius:14px; object-fit:cover; background:hsl(var(--muted))}
.att.up{opacity:.5}
.filechip{display:flex; align-items:center; gap:11px; text-decoration:none; color:inherit; padding:5px 6px}
.filechip .fi{font-size:20px; flex:0 0 auto; width:38px; height:38px; display:grid; place-items:center; background:hsl(var(--muted)); border-radius:11px}
.row.me .filechip .fi{background:hsl(var(--primary-foreground)/0.16)}
.filechip .fn{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px}
.filechip .fs{color:hsl(var(--muted-foreground)); font-size:12px; flex:0 0 auto; font-variant-numeric:tabular-nums}
.row.me .filechip .fs{color:hsl(var(--primary-foreground)/0.72)}
/* activity feed */
.act{align-self:stretch; display:flex; gap:9px; align-items:flex-start; font-size:12.5px; color:hsl(var(--muted-foreground)); padding:2px 6px; margin:2px auto; max-width:760px; width:100%}
.act .ai{flex:0 0 auto; width:13px; display:flex; justify-content:center; padding-top:2px; font-size:10px; color:hsl(var(--muted-foreground))}
.act.assistant .ai{color:hsl(var(--primary))}
.act .ax{flex:1; min-width:0; white-space:pre-wrap; overflow-wrap:anywhere; border-left:2px solid hsl(var(--border)); padding-left:11px}
.act.assistant .ax{color:hsl(var(--foreground)/0.74); white-space:normal; border-left-color:hsl(var(--primary)/0.45)}
.act.tool .ax{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px}
.act.user .ax{color:hsl(var(--foreground)/0.82)}
.act .ax p{margin:0 0 4px} .act .ax p:last-child{margin:0}
.act .ax ul,.act .ax ol{margin:2px 0; padding-left:18px}
.act .ax pre{background:hsl(240 10% 6%); color:hsl(0 0% 90%); padding:8px 10px; border-radius:calc(var(--radius) - 2px); overflow-x:auto; margin:4px 0; font-size:11.5px}
.act .ax code.inline{background:hsl(var(--muted)); padding:1px 4px; border-radius:4px; font-size:.85em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
body.hide-activity .act{display:none}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border:1px solid hsl(var(--border)); border-radius:var(--radius); margin-bottom:10px; font-weight:500; font-size:14px; cursor:pointer}
.switch{width:42px; height:24px; border-radius:999px; background:hsl(var(--input)); position:relative; transition:.2s; flex:0 0 auto; border:1px solid hsl(var(--border))}
.switch.on{background:hsl(var(--primary)); border-color:hsl(var(--primary))}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:hsl(var(--background)); transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on::after{left:20px; background:hsl(var(--primary-foreground))}
/* thinking indicator */
.think{display:inline-flex; align-items:center; gap:9px; padding:10px 14px; max-width:100%}
.pixgrid{display:grid; grid-template-columns:repeat(3,4px); gap:1.5px; flex:0 0 auto}
.pixgrid i{width:4px; height:4px; border-radius:1px; background:hsl(var(--foreground)); opacity:.15; animation:pixon .65s ease-in-out infinite}
.pixgrid i:nth-child(1){animation-delay:0ms} .pixgrid i:nth-child(2){animation-delay:80ms}
.pixgrid i:nth-child(3){animation-delay:160ms} .pixgrid i:nth-child(4){animation-delay:80ms}
.pixgrid i:nth-child(5){animation-delay:160ms} .pixgrid i:nth-child(6){animation-delay:240ms}
.pixgrid i:nth-child(7){animation-delay:160ms} .pixgrid i:nth-child(8){animation-delay:240ms}
.pixgrid i:nth-child(9){animation-delay:320ms}
.think .lbl{font-weight:500; font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  background:linear-gradient(90deg,hsl(var(--muted-foreground)) 35%,hsl(var(--foreground)) 50%,hsl(var(--muted-foreground)) 65%);
  background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 1.4s linear infinite}
.think .elapsed{font-family:var(--mono); font-size:11px; color:hsl(var(--muted-foreground)); font-variant-numeric:tabular-nums; flex:0 0 auto}
@keyframes pixon{0%,100%{opacity:.15} 18%,42%{opacity:1} 62%{opacity:.15}}
@keyframes shimmer{from{background-position:150% 0} to{background-position:-50% 0}}
/* streaming caret */
.stream-caret{display:inline-block; width:2px; height:1.02em; vertical-align:text-bottom; margin-left:2px; border-radius:1px; background:hsl(var(--foreground)); animation:caretblink 1s step-end infinite}
@keyframes caretblink{0%,100%{opacity:1} 50%{opacity:0}}
/* empty state */
.empty{margin:16vh auto 0; text-align:center; color:hsl(var(--muted-foreground)); max-width:320px; padding:0 20px}
.empty .big{width:56px; height:56px; border-radius:calc(var(--radius) + 2px); margin:0 auto 14px; background:hsl(var(--muted)); border:1px solid hsl(var(--border)); display:grid; place-items:center; font-size:26px; color:hsl(var(--foreground))}
.empty h2{margin:0 0 6px; color:hsl(var(--foreground)); font-size:17px; font-weight:600}
.empty p{font-size:13.5px; line-height:1.55}
/* composer */
.composer{
  border-top:1px solid hsl(var(--border)); background:hsl(var(--background)/0.9);
  -webkit-backdrop-filter:saturate(1.4) blur(12px); backdrop-filter:saturate(1.4) blur(12px);
  padding:9px 12px calc(9px + var(--safe-b)); display:flex; gap:9px; align-items:flex-end; position:relative; z-index:5;
}
.composer textarea{
  flex:1; resize:none; border:1px solid hsl(var(--input)); background:hsl(var(--muted)/0.55); color:hsl(var(--foreground));
  border-radius:23px; padding:11px 16px; font:inherit; font-size:16px; max-height:38vh; min-height:44px; line-height:1.35; outline:none;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.composer textarea::placeholder{color:hsl(var(--muted-foreground))}
.composer textarea:focus{border-color:hsl(var(--primary)/0.6); background:hsl(var(--background)); box-shadow:0 0 0 3px hsl(var(--primary)/0.15)}
.send{
  width:44px; height:44px; flex:0 0 auto; border:none; border-radius:50%; cursor:pointer;
  background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); font-size:19px; display:grid; place-items:center; transition:.15s;
  box-shadow:0 2px 9px hsl(var(--primary-strong)/0.32);
}
.send:disabled{background:hsl(var(--muted)); color:hsl(var(--muted-foreground)); box-shadow:none}
.send:active:not(:disabled){transform:scale(.9)}
/* sheet */
.scrim{position:fixed; inset:0; background:hsl(240 10% 3.9%/0.5); z-index:20; opacity:0; pointer-events:none; transition:.2s}
.scrim.show{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:21; background:hsl(var(--background));
  border-top:1px solid hsl(var(--border)); border-radius:16px 16px 0 0; padding:10px 18px calc(20px + var(--safe-b));
  box-shadow:0 -12px 40px rgba(0,0,0,.18); transform:translateY(100%); transition:transform .25s cubic-bezier(.2,.8,.2,1); max-width:560px; margin:0 auto;
}
.sheet.show{transform:none}
.grip{width:36px; height:4px; border-radius:2px; background:hsl(var(--border)); margin:4px auto 14px}
.sheet h3{margin:0 0 12px; font-size:16px; font-weight:600}
.field{display:flex; gap:8px; align-items:center; background:hsl(var(--muted)); border:1px solid hsl(var(--border)); border-radius:var(--radius); padding:10px 12px; margin-bottom:10px; font-size:12.5px; color:hsl(var(--muted-foreground)); word-break:break-all; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.field .val{flex:1; min-width:0}
.row-btns{display:flex; gap:10px; flex-wrap:wrap}
.btn{flex:1; min-width:120px; border:1px solid hsl(var(--border)); background:hsl(var(--background)); color:hsl(var(--foreground)); padding:10px 12px; border-radius:var(--radius); font:inherit; font-weight:500; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s}
.btn:hover{background:hsl(var(--accent))}
.btn.primary{background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); border-color:hsl(var(--primary))}
.btn.primary:hover{opacity:.9}
.btn.danger{color:hsl(var(--destructive)); border-color:hsl(var(--destructive)/0.4)}
.btn.danger:hover{background:hsl(var(--destructive)/0.08)}
.btn:active{transform:scale(.98)}
.hint{font-size:12.5px; color:hsl(var(--muted-foreground)); margin:2px 0 14px; line-height:1.55}
.toast{position:fixed; left:50%; bottom:calc(90px + var(--safe-b)); transform:translateX(-50%) translateY(20px); background:hsl(var(--foreground)); color:hsl(var(--background)); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:.25s; z-index:30}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
/* tool-call chips */
.toolchip{align-self:flex-start; display:inline-flex; align-items:center; gap:7px; max-width:min(100%,760px); margin:1px auto 1px 0;
  padding:4px 10px 4px 8px; border-radius:8px; background:hsl(var(--surface)); box-shadow:0 0 0 1px hsl(var(--border));
  font-family:var(--mono); font-size:11.5px; color:hsl(var(--muted-foreground)); animation:popin .25s var(--ease-strong) both; overflow:hidden}
.toolchip .tv{flex:0 0 auto; font-weight:600; color:hsl(var(--a-blue)); letter-spacing:.02em}
.toolchip .tt{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
body.hide-activity .toolchip{display:none}
/* collapsible thinking-trace */
.trace{align-self:stretch; max-width:760px; width:100%; margin:3px auto; border-radius:12px; background:hsl(var(--surface)/0.6); box-shadow:0 0 0 1px hsl(var(--border)); overflow:hidden; animation:fadeup .3s var(--ease-strong) both}
.trace-h{display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; user-select:none; font-size:12.5px; color:hsl(var(--muted-foreground)); -webkit-tap-highlight-color:transparent}
.trace-h .spark{color:hsl(var(--primary)); font-size:12px; flex:0 0 auto}
.trace-h .tlbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500}
.trace-h .tn{font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums; opacity:.8}
.trace-h .chev{flex:0 0 auto; transition:transform .2s var(--ease-strong); font-size:11px}
.trace.open .trace-h .chev{transform:rotate(180deg)}
.trace-b{display:none; padding:2px 12px 10px 12px; border-top:1px solid hsl(var(--border))}
.trace.open .trace-b{display:block}
.trace-b .act{margin:2px 0; padding:2px 0}
body.hide-activity .trace{display:none}
/* approval / ask card */
.askwrap{align-self:stretch; max-width:760px; width:100%; margin:6px auto; animation:fadeup .34s var(--ease-strong) both}
.askcard{border-radius:16px; background:hsl(var(--surface)); box-shadow:0 0 0 1px hsl(var(--border)),0 2px 10px hsl(20 14% 8%/0.06); overflow:hidden}
.askcard .q{padding:14px 16px 10px; font-weight:600; font-size:15px; letter-spacing:-.01em; line-height:1.35}
.askcard .qi{display:inline-flex; align-items:center; gap:7px}
.askcard .qi .spark{color:hsl(var(--primary))}
.askopts{display:flex; flex-direction:column; padding:0 10px 8px}
.askopt{display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:11px; border:none; background:transparent; color:hsl(var(--foreground));
  font:inherit; font-size:14.5px; text-align:left; cursor:pointer; transition:background .15s; width:100%}
.askopt:hover{background:hsl(var(--muted)/0.6)}
.askopt:active{background:hsl(var(--muted))}
.askopt .ring{flex:0 0 auto; width:19px; height:19px; border-radius:50%; box-shadow:inset 0 0 0 1.6px hsl(var(--muted-foreground)/0.6); transition:.15s; display:grid; place-items:center}
.askopt .ring::after{content:""; width:9px; height:9px; border-radius:50%; background:hsl(var(--primary)); transform:scale(0); transition:transform .18s var(--ease-strong)}
.askopt.chosen .ring{box-shadow:inset 0 0 0 6px hsl(var(--primary))}
.askopt.chosen .ring::after{background:hsl(var(--primary-foreground)); transform:scale(.5)}
.askopt .ol{flex:1; min-width:0}
.askcard.answered{opacity:.92}
.askcard.answered .askopt{cursor:default; pointer-events:none}
.askcard.answered .askopt:not(.chosen){opacity:.45}
.askcard .askfoot{display:flex; align-items:center; gap:7px; padding:8px 14px 12px; font-size:11.5px; color:hsl(var(--muted-foreground)); border-top:1px solid hsl(var(--border))}
.askcard .askfoot .ft{flex:1; min-width:0}
.askcard.answered .askfoot .ft{color:hsl(var(--a-green))}
/* diff blocks */
.dl{display:block; padding:0 13px; margin:0 -13px}
.dl.add{background:hsl(var(--a-green)/0.18); color:hsl(var(--a-green))}
.dl.del{background:hsl(var(--a-red)/0.18); color:hsl(var(--a-red))}
/* long-press message action menu */
.actmenu{position:fixed; z-index:40; background:hsl(var(--surface)); border-radius:13px; box-shadow:0 0 0 1px hsl(var(--border)),0 10px 34px hsl(20 14% 8%/0.22);
  padding:5px; min-width:168px; opacity:0; transform:scale(.95) translateY(4px); transform-origin:top center; transition:.14s var(--ease-strong); pointer-events:none}
.actmenu.show{opacity:1; transform:none; pointer-events:auto}
.actmenu button{display:flex; align-items:center; gap:11px; width:100%; border:none; background:transparent; color:hsl(var(--foreground)); font:inherit; font-size:14.5px; text-align:left; padding:10px 12px; border-radius:9px; cursor:pointer}
.actmenu button:hover{background:hsl(var(--muted)/0.6)} .actmenu button:active{background:hsl(var(--muted))}
.actmenu button .mi{width:18px; text-align:center; flex:0 0 auto; opacity:.75}
.actmenu button.danger{color:hsl(var(--destructive))}
.bubble.flash{animation:flash .6s ease}
@keyframes flash{0%,100%{box-shadow:0 1px 1px hsl(20 14% 8%/0.05)} 30%{box-shadow:0 0 0 2px hsl(var(--primary)/0.7)}}
/* skeleton shimmer */
.skel{position:relative; overflow:hidden; background:hsl(var(--muted)/0.7)}
.skel::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,hsl(var(--foreground)/0.06),transparent); transform:translateX(-100%); animation:sweep 1.3s infinite}
@keyframes sweep{to{transform:translateX(100%)}}
/* entrance keyframes */
@keyframes fadeup{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@keyframes popin{from{opacity:0; transform:scale(.95)} to{opacity:1; transform:none}}
::selection{background:hsl(var(--primary)/0.22)}
#scroll::-webkit-scrollbar{width:7px} #scroll::-webkit-scrollbar-thumb{background:hsl(var(--muted-foreground)/0.3); border-radius:4px}

/* ==========================================================================
   React host + liquid-gooey controls (new to the React port)
   ========================================================================== */
/* #root is the flex column the app lives in (body carries the hatch/background) */
#root{
  display:flex; flex-direction:column; overflow:hidden;
  height:100%; height:-webkit-fill-available; height:100svh; height:100dvh;
}
/* the composer's ＋ / ↑ glyphs render crisp on top of the merged coral goo mass */
.goocluster{position:relative}
.glyphbtn{
  width:44px; height:44px; padding:0; border:none; background:transparent;
  color:hsl(var(--primary-foreground)); line-height:1; display:grid; place-items:center;
  cursor:pointer; position:relative; z-index:1; transition:transform .15s, opacity .15s;
}
.glyphbtn.gattach{font-size:26px; font-weight:300}
.glyphbtn.gsend{font-size:19px; font-weight:500}
.glyphbtn.gsend.dim{opacity:.55}
.glyphbtn:active{transform:scale(.88)}
/* scroll-to-bottom FAB — a liquid blob accent */
.fabgoo{
  position:absolute; right:14px; bottom:calc(84px + var(--safe-b)); z-index:4;
  display:none; cursor:pointer;
}
.fabgoo.show{display:block}
.fabgoo .fabarrow{font-size:18px; color:hsl(var(--foreground)); line-height:1}
.fabgoo .badge{position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); font-size:10.5px; font-weight:600; display:grid; place-items:center; z-index:2}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important}
  .stream-caret,.pixgrid i,.think .lbl,.skel::after{animation:none !important}
  .think .lbl{color:hsl(var(--muted-foreground))}
  .goocluster svg,.fabgoo svg{animation:none !important}
}

</style>
</head>
