name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, browser-free checks: the app builds reproducibly from web/ (and the
  # committed app.html matches that build — the drift guard that replaced the
  # old inline-client sync check), plus the two Node unit tests.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build app and verify committed app.html is in sync
        # app.html is the esbuild bundle of web/ (React + Beautiful UI). The
        # lockfile pins esbuild, so the build is deterministic: a fresh build
        # must byte-match the committed file, or someone edited web/ without
        # rebuilding. Run `AAPP_OUT=…/app.html node web/build.mjs` to refresh.
        run: |
          cd web && npm ci && AAPP_OUT="$GITHUB_WORKSPACE/.claude/skills/aapp/app.html" node build.mjs
          cd "$GITHUB_WORKSPACE" && git diff --exit-code .claude/skills/aapp/app.html
      - name: Library unit test
        run: node test/client.test.js
      - name: Markdown renderer test
        run: node test/markdown.test.js

  # Full browser end-to-end: real app.html in Chromium + real bridge.py over a
  # local ntfy-compatible relay. Kept separate so a browser/env issue never
  # masks the unit job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright
          npx --yes playwright install --with-deps chromium
      - name: End-to-end
        run: node test/e2e.test.js
