name: Deploy aapp to GitHub Pages

# Publishes the static chat app (.claude/skills/aapp/app.html) to GitHub Pages
# as the site's index.html. Building from the canonical file via an artifact
# avoids Jekyll's exclusion of dot-folders like .claude/.
# Requires Pages Source = "GitHub Actions" (Settings -> Pages); the Actions
# token cannot enable Pages itself, so that toggle is a one-time manual step.
# (re-trigger nudge: prior run wedged in GitHub's queue)

on:
  push:
    branches:
      - main   # Pages deploys only from the default branch; a feature-branch
               # run can't deploy (github-pages environment) and would cancel
               # the main run via the shared concurrency group.
    paths:
      - .claude/skills/aapp/app.html
      - .claude/skills/aapp/app-next.html
      - .claude/skills/aapp/aapp-client.js
      - .claude/skills/aapp/scripts/sync-client.py
      - site/**
      - install.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify app.html inline client matches aapp-client.js
        # app.html carries a verbatim inline copy of aapp-client.js (it must stay
        # a single self-contained file). Fail the deploy if the two have drifted;
        # run scripts/sync-client.py --write to regenerate.
        run: python3 .claude/skills/aapp/scripts/sync-client.py --check
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/                            # landing page + assets (screenshot) + install.md
          cp .claude/skills/aapp/app.html _site/app.html # current
          cp .claude/skills/aapp/app-next.html _site/next.html  # React + Beautiful UI preview (unstamped => auto-update off)
          cp install.sh _site/install.sh                 # publish the installer at aapp.run/install.sh
          # Stamp the build id (commit sha) into the app and a sibling
          # version.json so the client can detect a newer deploy and auto-update.
          BUILD="${GITHUB_SHA}"
          sed -i "s/__AAPP_BUILD__/${BUILD}/g" _site/app.html
          printf '{"build":"%s"}\n' "${BUILD}" > _site/version.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
